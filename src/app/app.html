<nav class="navbar bg-body-tertiary border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand mb-0 h1 d-flex align-items-center gap-2" routerLink="/">
      <img src="favicon.ico" alt="" width="24" height="24" />
      <span>{{ appTitle() }}</span>
    </a>
    @if (editMode.enabled()) {
      <button
        type="button"
        class="btn btn-sm btn-primary ms-auto"
        (click)="downloadCatalog()"
        title="Aktuellen Katalog als catalog.json speichern"
      >
        catalog.json herunterladen
      </button>
    }
  </div>
</nav>

<main>
  <router-outlet />
</main>

@if (hasFooter()) {
  <footer class="border-top py-3 mt-4 text-center text-muted small">
    @if (hasImprint()) {
      <a class="link-secondary text-decoration-none" routerLink="/impressum">Impressum</a>
    }
    @if (hasImprint() && hasPrivacy()) {
      <span class="mx-2">·</span>
    }
    @if (hasPrivacy()) {
      <a class="link-secondary text-decoration-none" routerLink="/datenschutz">Datenschutz</a>
    }
  </footer>
}
