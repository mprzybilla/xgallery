server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip für Text-Assets
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Statische Daten (gemountet) — kurzes Caching, da austauschbar
    location /data/ {
        expires 5m;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Gebaute JS/CSS-Assets sind gehasht -> langes Caching
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular SPA: alle übrigen Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
